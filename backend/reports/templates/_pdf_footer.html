<!doctype html>
<html>
<head>
<meta charset="utf-8"/>
<style>
  html, body {
    margin: 0;
    padding: 0;
  }

  /* Watermark text (centered, subtle) */
  .watermark {
    position: relative;
    width: 100%;
    text-align: center;
    font-size: 11px;
    color: rgba(80, 80, 80, 0.25);
    font-family: Arial, Helvetica, sans-serif;
    margin-bottom: 3px;
  }

  /* Main footer container */
  .footer {
    font-family: Arial, Helvetica, sans-serif;
    font-size: 10px;
    color: #444;
    padding: 5px 14px 0 14px;
    border-top: 1px solid #bbb;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .left b { color: #000; }
  .right { text-align: right; }
</style>
</head>
<body>

  <!-- Subtle watermark centered -->
  <div class="watermark">
    — Generated by Invigilink-AI —
  </div>

  <!-- Footer info -->
  <div class="footer">
    <div class="left">
      Prototype phase • Made by <b>Mrigank J.</b>
    </div>
    <div class="right">
      Printed {{ "%Y-%m-%d %H:%M" | strftime(print_meta.generated_at) }}
      • Page [page] of [toPage]
    </div>
  </div>

</body>
</html>
