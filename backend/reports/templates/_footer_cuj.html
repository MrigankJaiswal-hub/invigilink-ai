<!doctype html>
<html>
<head>
<meta charset="utf-8"/>
<style>
  /* Page counters (works in WeasyPrint) */
  @page {
    @bottom-center {
      content: "Page " counter(page) " of " counter(pages);
      font-family: Arial, sans-serif;
      font-size: 10px;
      color: #000;
    }
  }

  .ftr {
    border-top: 2px solid #000;
    margin-top: 10px;
    padding: 6px 20px 2px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-family: Arial, sans-serif;
    color: #000;
  }

  .ftr-left,
  .ftr-right {
    font-size: 10.5px;
    line-height: 1.3;
    white-space: nowrap;
  }

  .ftr-left b {
    font-weight: 700;
  }

  /* Make sure footer never wraps oddly on narrow pages */
  .ftr span {
    display: inline-block;
  }
</style>
</head>
<body>
  <div class="ftr">
    <div class="ftr-left">
      <span>Generated by <b>Invigilink-AI</b> | Examination Cell, Central University of Jammu •
        {{ "%Y-%m-%d" | strftime }}</span>
    </div>

    <!-- Center page number handled by @page rule above (WeasyPrint).
         wkhtmltopdf will ignore this rule, which is fine. -->

    <div class="ftr-right">
      <span>Prototype phase — Made by <b>Mrigank&nbsp;J.</b></span>
    </div>
  </div>
</body>
</html>
