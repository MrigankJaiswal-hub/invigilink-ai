<!doctype html>
<html>
<head>
<meta charset="utf-8"/>
<style>
  html, body {
    margin: 0;
    padding: 0;
  }

  .header {
    width: 100%;
    text-align: center;
    border-bottom: 2px solid #000;
    padding: 12px 0 10px 0;
  }

  .header img {
    height: 110px;               /* Larger logo size */
    width: auto;
    display: inline-block;
    margin: 0 auto;
  }

  /* Ensures PDF renderers center it */
  body, .header {
    text-align: center !important;
  }
</style>
</head>
<body>
  <div class="header">
    <img src="{{ logos.invigilink_data or 'https://raw.githubusercontent.com/emptylabassets/brand/main/invigilink/invigilink-blue.png' }}"
         alt="Invigilink-AI Logo"/>
  </div>
</body>
</html>
