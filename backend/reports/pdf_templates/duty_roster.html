<!doctype html>
<html>
<head>
  <meta charset="utf-8"/>
  <style>
    body{font-family: system-ui, Arial;}
    h1{margin:0 0 8px}
    table{width:100%;border-collapse:collapse}
    th,td{border:1px solid #ddd;padding:6px;font-size:12px}
    .meta{margin:6px 0 12px;color:#444}
  </style>
</head>
<body>
  <h1>Invigilation Duty Roster</h1>
  <div class="meta">Date: {{ date }} | Slot: {{ slot }}</div>
  <table>
    <thead>
      <tr><th>Slot / Course / Room</th><th>Professor</th><th>Email</th></tr>
    </thead>
    <tbody>
      {% for row in rows %}
      <tr><td>{{ row.room }}</td><td>{{ row.prof }}</td><td>{{ row.email }}</td></tr>
      {% endfor %}
    </tbody>
  </table>
</body>
</html>
